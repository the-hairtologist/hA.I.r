name: Security Scan

# Weekly security audits
on:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday
  push:
    branches: [main] # Only on main branch pushes
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dependency Security Audit
  dependency-audit:
    name: 🔐 Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      
      - name: Run npm audit
        run: |
          echo "Running security audit..."
          npm audit --audit-level=moderate || true
          npm audit --audit-level=high
        continue-on-error: true
      
      - name: Check for outdated packages
        run: npm outdated || true

  # Code Security Analysis
  code-security:
    name: 🛡️ Code Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Check for hardcoded secrets
        run: |
          echo "Checking for potential hardcoded secrets..."
          ! grep -r "sk-" --include="*.ts" --include="*.tsx" --include="*.js" . || echo "⚠️ Found potential API keys"
          ! grep -r "AKIA" --include="*.ts" --include="*.tsx" --include="*.js" . || echo "⚠️ Found potential AWS keys"
      
      - name: Check for TODO security items
        run: |
          echo "Security TODOs:"
          grep -r "TODO.*security\|FIXME.*security\|XXX.*security" --include="*.ts" --include="*.tsx" . || echo "✅ No security TODOs found"
