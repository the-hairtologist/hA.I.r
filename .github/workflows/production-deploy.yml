# This workflow is disabled - using Lovable's built-in deployment
# To deploy: Click "Publish" button in Lovable dashboard
# Your app will be available at https://[your-project].lovable.app

name: Production Deploy (DISABLED)

on:
  workflow_dispatch:  # Manual trigger only

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notify-only:
    name: Deployment Info
    runs-on: ubuntu-latest
    steps:
      - name: Deployment Notice
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚀 This project uses Lovable's built-in deployment"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "To deploy to production:"
          echo "1. Open your project in Lovable"
          echo "2. Click the 'Publish' button (top-right)"
          echo "3. Your app will be live at https://[your-project].lovable.app"
          echo ""
          echo "✅ No manual deployment needed!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
