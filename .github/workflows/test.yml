name: E2E Tests

on:
  push:
    # For steady-state use at least 'main'. Change to ['**'] to run on all branches while iterating.
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      CI: true
      # Normalize cache location for Playwright across runners
      XDG_CACHE_HOME: ${{ runner.temp }}/cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Use Node 18 for parity with other workflows; change to 20 if your project requires it.
          node-version: '18'
          cache: 'npm'

      - name: Show environment
        run: |
          node --version
          npm --version
          npx --version
          echo "Runner OS: $RUNNER_OS"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ env.XDG_CACHE_HOME }}/ms-playwright
          # Keep the key limited to package-lock.json hash so it invalidates when deps change
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        env:
          CI: true
        run: npx playwright test --workers=4

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30
