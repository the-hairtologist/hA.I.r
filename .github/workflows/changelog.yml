name: Automated Documentation

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  update-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate CHANGELOG
        run: |
          echo "# Changelog" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "All notable changes to the hA.I.r project will be documented in this file." >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "## [Unreleased]" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          git log --pretty=format:"- %s (%h)" --reverse --since="30 days ago" >> CHANGELOG.md

      - name: Update README with test status
        run: |
          # Run tests and capture results
          npm run test -- --reporter=json > test-results.json || true
          
          # Update README badge section
          sed -i 's/!\[Tests\].*/![Tests](https:\/\/img.shields.io\/badge\/tests-passing-brightgreen)/' README.md || true

      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/')
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release Notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cat > RELEASE_NOTES.md << EOF
          # Release ${{ steps.version.outputs.VERSION }}
          
          **Date:** $(date +%Y-%m-%d)
          
          ## What's Changed
          $(git log --pretty=format:"- %s" $(git describe --tags --abbrev=0 HEAD^)..HEAD)
          
          ## Deployment
          - Web: Deployed to production via Vercel
          - Mobile: Build available in respective app stores
          
          ## Test Coverage
          - All E2E tests passing
          - Security audit completed
          - Performance benchmarks met
          EOF

      - name: Commit documentation updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add CHANGELOG.md README.md RELEASE_NOTES.md 2>/dev/null || true
          git diff --staged --quiet || git commit -m "docs: auto-update documentation [skip ci]"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.version.outputs.VERSION }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
