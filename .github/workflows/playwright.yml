name: Playwright CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  playwright:
    name: Run Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests (create report dir and run)
        run: |
          mkdir -p playwright-report
          # Run Playwright tests and produce HTML report; keep step exit 0 so uploads always run
          npx playwright test --reporter=list,html --output=playwright-report || true
        env:
          CI: true

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/**
          retention-days: 30

      - name: Upload Playwright traces (if exists)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            playwright-report/**/trace.zip
          retention-days: 30
