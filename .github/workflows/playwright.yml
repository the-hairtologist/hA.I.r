name: Playwright CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  playwright:
    name: Run Playwright tests
    runs-on: ubuntu-latest
    # Increase the job timeout to 120 minutes to avoid GitHub cancelling long test runs
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm ci

      - name: Install Playwright browsers
        # ensures the browsers are installed for Playwright test runs
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        # create the report dir in case Playwright doesn't create it before cancellation
        run: |
          mkdir -p playwright-report
          # Run Playwright tests and generate an HTML report; allow the step to fail so artifacts can still be uploaded
          npx playwright test --reporter=list,html --output=playwright-report || true

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/**

      - name: Upload Playwright traces (if exists)
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: playwright-report/**/trace.zip
