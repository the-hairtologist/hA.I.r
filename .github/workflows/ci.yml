name: CI
on:
  push:
    branches: ["fix/invite-client-dialog-form-refactor", "copilot/fix-invite-client-dialog-refactor"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Install, build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run lint
