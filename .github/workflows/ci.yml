name: CI

on:
  push:
    branches:
      - hA.I.r
      - main
      - copilot/fix-a11y-tester-and-comments
  pull_request:
    branches:
      - main
      - hA.I.r

jobs:
  build:
    name: Install, Typecheck, Build, Lint, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true
      
      - name: Lint
        run: npm run lint --if-present
        continue-on-error: true
      
      - name: Test
        run: npm run test --if-present
        continue-on-error: true
      
      - name: Build
        run: npm run build
