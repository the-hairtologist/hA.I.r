name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run type-check

      - name: Run security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Run unit tests
        run: npm run test
        continue-on-error: true

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Check bundle size
        run: npm run build
        continue-on-error: true

      - name: Analyze query patterns
        run: node scripts/analyze-queries.js
        continue-on-error: true

      - name: Check for duplicate requests
        run: |
          echo "Checking for duplicate database queries..."
          grep -r "supabase.from" src/ --include="*.tsx" --include="*.ts" | \
          awk -F: '{print $1}' | sort | uniq -c | sort -rn | head -10 || true
        continue-on-error: true

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let queryReport = '';
            try {
              const report = JSON.parse(fs.readFileSync('query-analysis-report.json', 'utf8'));
              queryReport = `\n### 📊 Query Analysis
              - Total queries: ${report.totalQueries}
              - Components with queries: ${report.componentsWithQueries}
              - Optimization opportunities: ${report.optimizationOpportunities}`;
            } catch (e) {}
            
            const output = `#### ✅ CI/CD Results
            - ✅ Linting: Passed
            - ✅ Type Check: Passed
            - ✅ Security Audit: Completed
            - ✅ E2E Tests: Check artifacts for details
            ${queryReport}
            
            📊 [View full report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            ---
            💡 **Next steps:** Review performance and security warnings above`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
