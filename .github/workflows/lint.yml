name: Lint

on:
  push:
    branches: [main, hA.I.r, develop]
  pull_request:
    branches: [main, hA.I.r, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🔍 Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check package-lock.json sync
        run: |
          npm install --package-lock-only --legacy-peer-deps
          if ! git diff --exit-code package-lock.json; then
            echo "❌ package-lock.json is out of sync with package.json"
            echo "Run 'npm install' locally and commit the updated package-lock.json"
            exit 1
          fi
          echo "✅ package-lock.json is in sync"

      - name: Check for extraneous packages
        run: |
          if npm prune --dry-run --legacy-peer-deps 2>&1 | grep -q "removed"; then
            echo "❌ Found extraneous packages. Run 'npm prune' locally."
            npm prune --dry-run --legacy-peer-deps
            exit 1
          fi
          echo "✅ No extraneous packages found"

      - name: Run ESLint (strict - fail on warnings)
        run: npm run lint

      - name: Check code formatting with Prettier
        run: npm run format:check

      - name: Upload lint results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: |
            eslint-report.json
            prettier-report.txt
          retention-days: 7
