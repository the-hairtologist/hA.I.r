# Auto-label PRs based on changed files

'frontend':
  - 'src/components/**/*'
  - 'src/pages/**/*'
  - 'src/styles/**/*'

'backend':
  - 'supabase/**/*'
  - 'src/lib/supabase/**/*'

'performance':
  - 'src/lib/queryMonitor.ts'
  - 'src/hooks/useCachedQuery.ts'
  - 'scripts/analyze-queries.js'

'ci/cd':
  - '.github/workflows/**/*'

'documentation':
  - '*.md'
  - 'docs/**/*'

'hooks':
  - 'src/hooks/**/*'

'database':
  - 'supabase/migrations/**/*'
